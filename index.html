<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1017" />
    <title>Zamah: a 2D physics engine written from scratch</title>
    <meta
      name="description"
      content="Zamah is a real-time 2D physics engine written from scratch in TypeScript: rigid bodies, XPBD cloth and soft bodies, and a particle fluid. Build things and knock them down in the browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Cpath d='M16 4v13' stroke='%238b95a7' stroke-width='2' stroke-linecap='round' transform='rotate(-28 16 4)'/%3E%3Ccircle cx='22.1' cy='20.5' r='6' fill='%23f5a44a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/sandbox/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <a class="brand" href="./" aria-label="Zamah, reload">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M16 3v14" stroke="#8b95a7" stroke-width="2" stroke-linecap="round" transform="rotate(-28 16 3)" />
            <circle cx="22.6" cy="20.4" r="6.2" fill="#f5a44a" />
          </svg>
          <span class="brand-name">Zamah</span>
          <span class="brand-tag">2D physics engine</span>
        </a>
        <nav id="scenes" class="scenes" aria-label="Scenes"></nav>
        <a id="repo" class="repo" target="_blank" rel="noreferrer" hidden>GitHub</a>
      </header>

      <div class="controls">
        <div id="tools" class="tools" role="toolbar" aria-label="Tools"></div>
        <div class="transport">
          <button id="pause" type="button" title="Pause or resume (Space)">Pause</button>
          <button id="step" type="button" title="Advance one step while paused (.)">Step</button>
          <button id="reset" type="button" title="Rebuild the scene (R)">Reset</button>
          <button id="panel-toggle" type="button" title="Show or hide the debug panel (D)" aria-expanded="false">
            Debug
          </button>
        </div>
      </div>

      <main id="stage" class="stage">
        <canvas id="view" aria-label="Physics sandbox. Use the mouse or touch to interact."></canvas>

        <div class="caption">
          <h1 id="scene-title"></h1>
          <p id="scene-blurb"></p>
          <p id="scene-hint" class="hint"></p>
        </div>

        <aside id="panel" class="panel" hidden>
          <section>
            <h2>Timing</h2>
            <div class="rows" id="timing"></div>
          </section>
          <section>
            <h2>World</h2>
            <div class="rows" id="counts"></div>
          </section>
          <section>
            <h2>Draw</h2>
            <label><input type="checkbox" data-debug="contacts" /> Contact points</label>
            <label><input type="checkbox" data-debug="bounds" /> Bounding-box tree</label>
            <label><input type="checkbox" data-debug="joints" /> Joints</label>
            <label><input type="checkbox" data-debug="sleep" /> Dim sleeping bodies</label>
            <label><input type="checkbox" data-debug="particles" /> Particles</label>
          </section>
          <section>
            <h2>Solver</h2>
            <label class="slider"
              >Sub-steps <output id="substeps-value">4</output>
              <input id="substeps" type="range" min="1" max="8" step="1" value="4"
            /></label>
            <label><input id="warm" type="checkbox" checked /> Warm starting</label>
            <label><input id="sleeping" type="checkbox" checked /> Sleeping</label>
            <label><input id="gravity" type="checkbox" checked /> Gravity</label>
            <label><input id="slow" type="checkbox" /> Slow motion</label>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/sandbox/main.ts"></script>
  </body>
</html>
